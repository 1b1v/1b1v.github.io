site_name: Orion Documentation
site_url: https://almarelplugins.github.io/orion-docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Community: index.md
  - Brushes: brushes.md
  - Masks: masks.md
  - Patterns: patterns.md
  - Commands: commands.md
  - Permissions: permissions.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg